name: Build PullOver-X

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        build_variant: [roothide, rootless]

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Link /opt/theos
        run: |
          sudo mkdir -p /opt
          sudo ln -sfn "$GITHUB_WORKSPACE/theos-roothide" /opt/theos

      - name: Install packaging tools
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Bump Package Version
        run: |
          VERSION="1.7.${{ github.run_number }}"
          echo "Using version: $VERSION"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" PullOverX/Package/DEBIAN/control

      - name: Build Package
        run: |
          chmod +x build.sh
          ./build.sh "${{ matrix.build_variant }}" release
          echo "=== .deb files ==="
          find ./packages -name "*.deb" -type f

      - name: Rename Package By Variant
        run: |
          for f in ./packages/*.deb; do
            base=$(basename "$f" .deb)
            mv "$f" "./packages/${base}-${{ matrix.build_variant }}.deb"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.build_variant }}
          path: ./packages/*.deb
          if-no-files-found: error

      - name: Create Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v1.7.${{ github.run_number }}
          name: "PullOver X (复刻) v1.7.${{ github.run_number }}"
          files: ./packages/*.deb
